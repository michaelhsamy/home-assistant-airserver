name: AirServer Connect
version: "0.1.1"
slug: airserver_connect
description: Independent livestream, RTSP, and end-session controls for AirServer Connect devices.
url: https://github.com/michaelhsamy/home-assistant-airserver
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
services:
  - mqtt:need
options:
  devices: []
  poll_interval: 5
schema:
  devices:
    - name: str
      host: str
      api_key: password
      verify_ssl: bool?
      state_source: list(api|services)?
  poll_interval: int(2,300)
